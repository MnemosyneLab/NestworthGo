name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.2.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install native Go build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Generate Wails bindings
        working-directory: frontend
        run: pnpm run generate:bindings
      - name: Verify generated Wails bindings
        working-directory: frontend
        run: pnpm run check:bindings
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: Frontend build
        working-directory: frontend
        run: pnpm run build
      - name: Go tests
        run: go test ./...
      - name: Validate user skill and installer
        run: |
          python3 tools/check-nestworth-skill.py
          python3 -m unittest discover -s tools/tests -v
      - name: Go vet
        run: go vet ./...
      - name: Go build
        run: go build ./cmd/nestworth
      - name: Frontend lint
        working-directory: frontend
        run: pnpm run lint
      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Frontend tests
        working-directory: frontend
        run: pnpm run test
      - name: Trailing whitespace
        run: git diff --check

  # Application and MCP tests call t.Parallel and are bounded with -parallel 4.
  # Four tests stay sequential: three share process-global product fault
  # injection, and TestAnalysisPerformanceBudgets asserts wall-clock budgets.
  # Shards run on separate runners. Within a shard, packages stay at -p 1 so
  # they do not compete, and every test still uses the default 10m package timeout.
  race-shard:
    name: race (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [application, mcpserver, infrastructure, remainder]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native Go build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
      - name: Go tests with race detector
        run: |
          set -euo pipefail
          parallel=()
          case "${{ matrix.shard }}" in
            application)
              pkgs=(./internal/application)
              parallel=(-parallel 4)
              ;;
            mcpserver)
              pkgs=(./internal/mcpserver)
              parallel=(-parallel 4)
              ;;
            infrastructure)
              pkgs=(./internal/infrastructure/...)
              ;;
            remainder)
              mapfile -t pkgs < <(go list ./... | grep -v -E '^github.com/waltwang/nestworth-go/internal/(application$|mcpserver$|infrastructure($|/))')
              ;;
            *)
              echo "unknown race shard: ${{ matrix.shard }}" >&2
              exit 1
              ;;
          esac
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "race shard selected no packages" >&2
            exit 1
          fi
          printf 'shard %s packages:\n' "${{ matrix.shard }}"
          printf '  %s\n' "${pkgs[@]}"
          go test -race -p 1 "${parallel[@]}" "${pkgs[@]}"

  race:
    needs: race-shard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require every race shard
        run: |
          if [ "${{ needs.race-shard.result }}" != "success" ]; then
            echo "race shards result: ${{ needs.race-shard.result }}"
            exit 1
          fi
          echo "all race shards passed"
