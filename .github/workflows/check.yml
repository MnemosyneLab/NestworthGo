name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.2.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install native Go build dependencies
        timeout-minutes: 15
        run: bash tools/ci-install-native-deps.sh
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Generate Wails bindings
        working-directory: frontend
        run: pnpm run generate:bindings
      - name: Verify generated Wails bindings
        working-directory: frontend
        run: pnpm run check:bindings
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: Frontend build
        working-directory: frontend
        run: pnpm run build
      - name: Go tests
        run: go test ./...
      - name: Validate user skill and installer
        run: |
          python3 tools/check-nestworth-skill.py
          python3 -m unittest discover -s tools/tests -v
      - name: Go vet
        run: go vet ./...
      - name: Go build
        run: go build ./cmd/nestworth
      - name: Frontend lint
        working-directory: frontend
        run: pnpm run lint
      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Frontend tests
        working-directory: frontend
        run: pnpm run test
      - name: Trailing whitespace
        run: git diff --check

  # Application 2/2 repeatedly exhausted Go's cumulative 10m test budget
  # (PR #60, main, PR #61); no assertion or race detector failure preceded it.
  # Eight application parts reduce cumulative package time per runner without
  # increasing in-process concurrency or skipping tests. MCP remains two parts.
  # SQLite also hit its 10m package budget, so split that package across two
  # deterministic test-name parts. Keep the 10m bound
  # explicit and retain per-test JSON evidence for future distribution reviews.
  # Test/Example/Fuzz names come from the same race build as the run. Fault
  # injection and uncontended performance tests retain their sequential status.
  race-shard:
    name: race (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: application
            part: 0
            parts: 8
            label: application 1/8
          - shard: application
            part: 1
            parts: 8
            label: application 2/8
          - shard: application
            part: 2
            parts: 8
            label: application 3/8
          - shard: application
            part: 3
            parts: 8
            label: application 4/8
          - shard: application
            part: 4
            parts: 8
            label: application 5/8
          - shard: application
            part: 5
            parts: 8
            label: application 6/8
          - shard: application
            part: 6
            parts: 8
            label: application 7/8
          - shard: application
            part: 7
            parts: 8
            label: application 8/8
          - shard: mcpserver
            part: 0
            parts: 2
            label: mcpserver 1/2
          - shard: mcpserver
            part: 1
            parts: 2
            label: mcpserver 2/2
          - shard: infrastructure
            part: 0
            parts: 2
            label: infrastructure 1/2
          - shard: infrastructure
            part: 1
            parts: 2
            label: infrastructure 2/2
          - shard: remainder
            part: 0
            parts: 1
            label: remainder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native Go build dependencies
        timeout-minutes: 15
        run: bash tools/ci-install-native-deps.sh
      - name: Go tests with race detector
        run: |
          set -euo pipefail
          shard="${{ matrix.shard }}"
          part="${{ matrix.part }}"
          parts="${{ matrix.parts }}"
          parallel=()
          split_tests=false
          case "$shard" in
            application)
              pkgs=(./internal/application)
              parallel=(-parallel 4)
              split_tests=true
              ;;
            mcpserver)
              pkgs=(./internal/mcpserver)
              parallel=(-parallel 4)
              split_tests=true
              ;;
            infrastructure)
              go list ./internal/infrastructure/... > "$RUNNER_TEMP/race-packages.txt"
              mapfile -t pkgs < "$RUNNER_TEMP/race-packages.txt"
              ;;
            remainder)
              # Check enumeration before filtering; process substitution hides
              # a failed go list and can silently drop packages.
              go list ./... > "$RUNNER_TEMP/race-packages.txt"
              mapfile -t pkgs < <(grep -v -E '^github.com/waltwang/nestworth-go/internal/(application$|mcpserver$|infrastructure($|/))' "$RUNNER_TEMP/race-packages.txt")
              ;;
            *)
              echo "unknown race shard: $shard" >&2
              exit 1
              ;;
          esac
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "race shard selected no packages" >&2
            exit 1
          fi
          printf 'shard %s packages:\n' "$shard"
          printf '  %s\n' "${pkgs[@]}"
          : > "$RUNNER_TEMP/race-results.jsonl"
          ran=0
          run_package() {
            local pkg=$1 regex=${2:-}
            local selection=()
            if [ -n "$regex" ]; then
              selection=(-run "$regex")
            fi
            go test -race -count=1 -json -timeout 10m -p 1 "${parallel[@]}" "${selection[@]}" "$pkg" | tee -a "$RUNNER_TEMP/race-results.jsonl"
          }
          if [ "$shard" = remainder ]; then
            go test -race -count=1 -json -timeout 10m -p 1 "${pkgs[@]}" | tee -a "$RUNNER_TEMP/race-results.jsonl"
            ran=1
          else
            for pkg in "${pkgs[@]}"; do
              regex=""
              if [ "$split_tests" = true ]; then
                # stdout is only the -run regex. A failed enumeration, empty
                # runnable set, or empty part fails closed.
                if ! regex=$(bash tools/race-shard-select.sh "$part" "$parts" "$pkg"); then
                  echo "race shard $shard part $part selector failed for $pkg" >&2
                  exit 1
                fi
              elif [ "$shard" = infrastructure ] && [[ "$pkg" == */sqlite ]]; then
                if ! regex=$(bash tools/race-shard-select.sh "$part" "$parts" "$pkg"); then
                  echo "race shard $shard part $part selector failed for $pkg" >&2
                  exit 1
                fi
              elif [ "$shard" = infrastructure ] && [ "$part" != 0 ]; then
                # Non-SQLite infrastructure packages stay on part zero; only
                # SQLite exceeded the per-package cumulative test budget.
                continue
              fi
              run_package "$pkg" "$regex"
              ran=$((ran + 1))
            done
          fi
          if [ "$ran" -eq 0 ]; then
            echo "race shard selected no packages/tests" >&2
            exit 1
          fi
      - name: Retain race test timings and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-${{ matrix.shard }}-${{ matrix.part }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/race-results.jsonl
          if-no-files-found: error
          retention-days: 7

  race:
    needs: race-shard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require every race shard
        run: |
          if [ "${{ needs.race-shard.result }}" != "success" ]; then
            echo "race shards result: ${{ needs.race-shard.result }}"
            exit 1
          fi
          echo "all race shards passed"
