name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.2.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install native Go build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Generate Wails bindings
        working-directory: frontend
        run: pnpm run generate:bindings
      - name: Verify generated Wails bindings
        working-directory: frontend
        run: pnpm run check:bindings
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: Frontend build
        working-directory: frontend
        run: pnpm run build
      - name: Go tests
        run: go test ./...
      - name: Validate user skill and installer
        run: |
          python3 tools/check-nestworth-skill.py
          python3 -m unittest discover -s tools/tests -v
      - name: Go vet
        run: go vet ./...
      - name: Go build
        run: go build ./cmd/nestworth
      - name: Frontend lint
        working-directory: frontend
        run: pnpm run lint
      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Frontend tests
        working-directory: frontend
        run: pnpm run test
      - name: Trailing whitespace
        run: git diff --check

  # PR #44 integration race job 113326922058 timed out the application
  # package at 600.030s. MCP passed that run at 577.280s. Each of those
  # packages is therefore split into two go test processes, each with its own
  # default 10m timeout, and up to 4 tests run at once. The other four tests
  # stay sequential inside whichever part contains them: three write
  # process-global product fault injection, and TestAnalysisPerformanceBudgets
  # asserts uncontended wall-clock budgets. Packages in a shard stay at -p 1.
  race-shard:
    name: race (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: application
            part: 0
            parts: 2
            label: application 1/2
          - shard: application
            part: 1
            parts: 2
            label: application 2/2
          - shard: mcpserver
            part: 0
            parts: 2
            label: mcpserver 1/2
          - shard: mcpserver
            part: 1
            parts: 2
            label: mcpserver 2/2
          - shard: infrastructure
            part: 0
            parts: 1
            label: infrastructure
          - shard: remainder
            part: 0
            parts: 1
            label: remainder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native Go build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
      - name: Go tests with race detector
        run: |
          set -euo pipefail
          shard="${{ matrix.shard }}"
          part="${{ matrix.part }}"
          parts="${{ matrix.parts }}"
          parallel=()
          run_args=()
          case "$shard" in
            application)
              pkgs=(./internal/application)
              parallel=(-parallel 4)
              ;;
            mcpserver)
              pkgs=(./internal/mcpserver)
              parallel=(-parallel 4)
              ;;
            infrastructure)
              pkgs=(./internal/infrastructure/...)
              ;;
            remainder)
              mapfile -t pkgs < <(go list ./... | grep -v -E '^github.com/waltwang/nestworth-go/internal/(application$|mcpserver$|infrastructure($|/))')
              ;;
            *)
              echo "unknown race shard: $shard" >&2
              exit 1
              ;;
          esac
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "race shard selected no packages" >&2
            exit 1
          fi
          if [ "$parts" != "1" ]; then
            mapfile -t names < <(go test -list . "${pkgs[0]}" | grep '^Test')
            selected=()
            for name in "${names[@]}"; do
              sum=$(printf '%s' "$name" | cksum | awk '{print $1}')
              if [ $((sum % parts)) -eq "$part" ]; then
                selected+=("$name")
              fi
            done
            if [ "${#names[@]}" -eq 0 ] || [ "${#selected[@]}" -eq 0 ]; then
              echo "race shard $shard part $part selected no tests" >&2
              exit 1
            fi
            regex='^('
            for i in "${!selected[@]}"; do
              if [ "$i" -gt 0 ]; then
                regex+='|'
              fi
              regex+="${selected[$i]}"
            done
            regex+=')$'
            run_args=(-run "$regex")
            echo "shard $shard part $((part + 1))/$parts runs ${#selected[@]} of ${#names[@]} tests"
          fi
          printf 'shard %s packages:\n' "$shard"
          printf '  %s\n' "${pkgs[@]}"
          go test -race -p 1 "${parallel[@]}" "${run_args[@]}" "${pkgs[@]}"

  race:
    needs: race-shard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require every race shard
        run: |
          if [ "${{ needs.race-shard.result }}" != "success" ]; then
            echo "race shards result: ${{ needs.race-shard.result }}"
            exit 1
          fi
          echo "all race shards passed"
