name: check

# Trial only: no PR event can schedule fork code on a persistent personal Mac.
# Push events come from repository writers; dispatch requires repository access.
on:
  push:
    branches: [main, ci/macos-arm64-trial]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: check-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  MACOSX_DEPLOYMENT_TARGET: '27.0'
  CGO_CFLAGS: '-O2 -g -mmacosx-version-min=27.0'
  CGO_CXXFLAGS: '-O2 -g -mmacosx-version-min=27.0'
  CGO_LDFLAGS: '-O2 -g -mmacosx-version-min=27.0'

jobs:
  test:
    name: test
    if: github.repository == 'MnemosyneLab/NestworthGo' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          dest: ${{ runner.temp }}/nestworth-pnpm
      - name: Verify native environment and select persistent caches
        run: python3 tools/ci-macos-environment.py
      - name: Prepare pinned Wails CLI
        run: |
          read -r go_version wails_version <<< "$(python3 tools/ci-toolchain-versions.py)"
          if [ ! -x "$GOBIN/wails3" ]; then
            go install "github.com/wailsapp/wails/v3/cmd/wails3@$wails_version"
          fi
          test "$("$GOBIN/wails3" version 2>&1)" = "$wails_version"
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --store-dir "$NESTWORTH_PNPM_STORE"
      - name: Generate Wails bindings once
        id: bindings
        working-directory: frontend
        run: node scripts/ensure-bindings.mjs
      - name: gofmt
        id: format
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' }}
        continue-on-error: true
        run: test -z "$(gofmt -l cmd internal)"
      - name: Go tests (all packages, bounded local parallelism)
        id: go-tests
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' }}
        continue-on-error: true
        run: |
          go list ./... | tee "$RUNNER_TEMP/go-packages.txt"
          go test -count=1 -json -timeout 20m -p "$NESTWORTH_GO_PARALLEL" ./... | tee "$RUNNER_TEMP/go-results.jsonl"
      - name: Go vet
        id: vet
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' }}
        continue-on-error: true
        run: go vet -p "$NESTWORTH_GO_PARALLEL" ./...
      - name: Go build
        id: build
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' }}
        continue-on-error: true
        run: go build -p "$NESTWORTH_GO_PARALLEL" -o "$RUNNER_TEMP/nestworth-ci" ./cmd/nestworth
      - name: Validate user skill and installer
        id: tooling
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 tools/check-nestworth-skill.py
          python3 tools/run-tooling-tests.py --tier fast
      - name: Frontend lint
        id: lint
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' }}
        continue-on-error: true
        working-directory: frontend
        run: pnpm exec eslint .
      - name: Frontend typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' }}
        continue-on-error: true
        working-directory: frontend
        run: pnpm exec tsc --noEmit
      - name: Frontend build
        id: frontend-build
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' }}
        continue-on-error: true
        working-directory: frontend
        run: pnpm exec vite build --mode production
      - name: Frontend tests (entire suite, bounded workers)
        id: frontend-tests
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' }}
        continue-on-error: true
        working-directory: frontend
        run: pnpm exec vitest run --maxWorkers="$NESTWORTH_FRONTEND_WORKERS" --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/frontend-results.json"
      - name: Trailing whitespace
        id: whitespace
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' }}
        continue-on-error: true
        run: git diff --check
      - name: Require every correctness gate
        if: always()
        env:
          GATE_RESULTS: ${{ toJSON(steps) }}
        run: python3 tools/ci-macos-results.py
      - name: Retain environment, full test results and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-environment.json
            ${{ runner.temp }}/macos-gates.json
            ${{ runner.temp }}/go-packages.txt
            ${{ runner.temp }}/go-results.jsonl
            ${{ runner.temp }}/frontend-results.json
          if-no-files-found: warn
          retention-days: 7
