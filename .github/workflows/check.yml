name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Wall clock is the slowest job. Race detection is weekly in perf.yml.
# Non-race Go tests are checksum shards so one package cannot hold the run.
# The aggregate check name stays `test`.
jobs:
  meta:
    name: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native Go build dependencies
        timeout-minutes: 15
        run: bash tools/ci-install-native-deps.sh
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: Go vet
        run: go vet ./...
      - name: Go build
        run: go build ./cmd/nestworth
      - name: Validate user skill and installer
        run: |
          python3 tools/check-nestworth-skill.py
          python3 -m unittest discover -s tools/tests -v
      - name: Trailing whitespace
        run: git diff --check

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.2.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install native Go build dependencies
        timeout-minutes: 15
        run: bash tools/ci-install-native-deps.sh
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # ensure-bindings defaults to an ephemeral GOCACHE, so a restored
      # setup-go cache never reused the Wails compile (~70s median).
      - name: Reuse Go build cache for Wails bindings
        run: echo "NESTWORTH_WAILS_GOCACHE=$GOCACHE" >> "$GITHUB_ENV"
      - name: Generate Wails bindings
        working-directory: frontend
        run: pnpm run generate:bindings
      - name: Verify generated Wails bindings
        working-directory: frontend
        run: pnpm run check:bindings
      - name: Frontend lint
        working-directory: frontend
        run: pnpm run lint
      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Frontend build
        working-directory: frontend
        run: pnpm run build
      # Same Vitest command as `pnpm run test` after bindings exist. maxWorkers
      # stays 4. A second machine shard was not worth a queued runner.
      - name: Frontend tests
        working-directory: frontend
        run: pnpm exec vitest run
      - name: Trailing whitespace
        run: git diff --check

  # Name-hash parts spread one package across runners. Enumeration is the
  # non-race test binary. An empty part or an empty package list fails the shard.
  go-shard:
    name: go (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: application
            part: 0
            parts: 4
            label: application 1/4
          - shard: application
            part: 1
            parts: 4
            label: application 2/4
          - shard: application
            part: 2
            parts: 4
            label: application 3/4
          - shard: application
            part: 3
            parts: 4
            label: application 4/4
          - shard: mcpserver
            part: 0
            parts: 2
            label: mcpserver 1/2
          - shard: mcpserver
            part: 1
            parts: 2
            label: mcpserver 2/2
          - shard: sqlite
            part: 0
            parts: 2
            label: sqlite 1/2
          - shard: sqlite
            part: 1
            parts: 2
            label: sqlite 2/2
          - shard: continuousbackup
            part: 0
            parts: 1
            label: continuousbackup
          - shard: remainder
            part: 0
            parts: 1
            label: remainder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native Go build dependencies
        timeout-minutes: 15
        run: bash tools/ci-install-native-deps.sh
      - name: Go tests
        run: |
          set -euo pipefail
          shard="${{ matrix.shard }}"
          part="${{ matrix.part }}"
          parts="${{ matrix.parts }}"
          pkg_parallel=(-p 1)
          run_args=()
          case "$shard" in
            application)
              pkgs=(./internal/application)
              ;;
            mcpserver)
              pkgs=(./internal/mcpserver)
              ;;
            sqlite)
              pkgs=(./internal/infrastructure/sqlite)
              ;;
            continuousbackup)
              pkgs=(./internal/infrastructure/continuousbackup)
              ;;
            remainder)
              pkg_parallel=(-p 2)
              # Check enumeration before filtering; process substitution hides
              # a failed go list and can silently drop packages.
              go list ./... > "$RUNNER_TEMP/go-packages.txt"
              mapfile -t pkgs < <(grep -v -E '^github.com/waltwang/nestworth-go/internal/(application$|mcpserver$|infrastructure/sqlite($|/)|infrastructure/continuousbackup($|/))' "$RUNNER_TEMP/go-packages.txt")
              go list ./internal/infrastructure/... > "$RUNNER_TEMP/infrastructure-packages.txt"
              covered=0
              while IFS= read -r pkg || [ -n "$pkg" ]; do
                case "$pkg" in
                  */infrastructure/sqlite|*/infrastructure/sqlite/*|*/infrastructure/continuousbackup|*/infrastructure/continuousbackup/*)
                    covered=$((covered + 1))
                    ;;
                  *)
                    found=0
                    for selected in "${pkgs[@]}"; do
                      if [ "$selected" = "$pkg" ]; then
                        found=1
                        break
                      fi
                    done
                    if [ "$found" -ne 1 ]; then
                      echo "infrastructure package missing from remainder: $pkg" >&2
                      exit 1
                    fi
                    ;;
                esac
              done < "$RUNNER_TEMP/infrastructure-packages.txt"
              if [ "$covered" -lt 2 ]; then
                echo "infrastructure partition does not cover go list" >&2
                exit 1
              fi
              dedicated=0
              while IFS= read -r pkg || [ -n "$pkg" ]; do
                case "$pkg" in
                  */internal/application|*/internal/mcpserver|*/infrastructure/sqlite|*/infrastructure/continuousbackup)
                    dedicated=$((dedicated + 1))
                    ;;
                esac
              done < "$RUNNER_TEMP/go-packages.txt"
              if [ "$dedicated" -ne 4 ]; then
                echo "go list does not contain exactly the four dedicated packages" >&2
                exit 1
              fi
              ;;
            *)
              echo "unknown go shard: $shard" >&2
              exit 1
              ;;
          esac
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "go shard selected no packages" >&2
            exit 1
          fi
          if [ "$parts" != "1" ]; then
            if [ "${#pkgs[@]}" -ne 1 ]; then
              echo "split go shard must list exactly one package" >&2
              exit 1
            fi
            # Non-race list. A non-zero selector status fails the shard,
            # including an empty part.
            if ! regex=$(bash tools/race-shard-select.sh --enumerate "$part" "$parts" -- go test -count=1 -list . "${pkgs[0]}"); then
              echo "go shard $shard part $part selector failed" >&2
              exit 1
            fi
            if [ -z "$regex" ]; then
              echo "go shard $shard part $part selector returned an empty regex" >&2
              exit 1
            fi
            run_args=(-run "$regex")
          fi
          printf 'shard %s packages:\n' "$shard"
          printf '  %s\n' "${pkgs[@]}"
          go test -count=1 -json -timeout 20m "${pkg_parallel[@]}" "${run_args[@]}" "${pkgs[@]}" | tee "$RUNNER_TEMP/go-results.jsonl"
      - name: Retain Go test timings and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.shard }}-${{ matrix.part }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-results.jsonl
          if-no-files-found: error
          retention-days: 7

  # Required check name. Fails closed unless every gate job succeeded.
  test:
    name: test
    needs: [meta, frontend, go-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test gate
        run: |
          set -euo pipefail
          results=(
            "meta=${{ needs.meta.result }}"
            "frontend=${{ needs.frontend.result }}"
            "go-shard=${{ needs.go-shard.result }}"
          )
          printf '%s\n' "${results[@]}"
          for item in "${results[@]}"; do
            if [ "${item#*=}" != "success" ]; then
              echo "test gate failed: $item" >&2
              exit 1
            fi
          done
          echo "all test gates passed"
