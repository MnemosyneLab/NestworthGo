name: perf

# Daily and manual heavy checks. They do not run on push or pull_request.
# 21:00 UTC, plus Actions → perf → Run workflow.
#
# Performance evidence lives in *_perf_test.go files behind //go:build perf.
# The build tag is the gate. Per-PR check.yml does not compile or vet those
# files. Daily and manual commands pass -tags perf and select only the perf
# tests and benchmarks; without -run, -tags perf would also execute the normal
# suite.
#
# Expected durations (test time, after native dependencies):
#   scale     15–40 min  (bounded profiles, memory, benchmarks once;
#                         financial-source writes default to 10 samples)
#   pipeline  25–60 min  (365-day book, 2000 pairs, cold + 10 incrementals)
#   paired    10–25 min  (3 samples of the reference R30 book)
#   epoch     10–30 min  (10 samples, 64 no-op cycles, stage trace)
# NW_REVIEW_PERF_SAMPLES overrides those counts; 30 restores the previous
# sample size. Job timeouts include native-dependency install and stay above
# the new upper estimates: pipeline 90m test / 110m job, paired 50m / 70m,
# epoch 45m / 65m. Scale stays 50m / 75m because its other profiles did not
# shrink with the write-sample count. The daily wall clock is the longest
# job, pipeline, because the perf matrix runs in parallel.
#
# A scheduled run first asks whether the default branch moved since the last
# successful scheduled run. The same commit skips perf and race and stays
# green. The first scheduled run, a new commit, and every manual dispatch
# execute the jobs. Failed and cancelled runs are not that baseline.
#
# Race shards stay on this schedule and do not pass -tags perf, so the
# full-scale profiles stay out of the 10-minute race budget. JSON artifacts
# keep per-test timings.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

jobs:
  # Scheduled runs only. Manual dispatch always sets should_run=true.
  # The baseline is the newest previous successful scheduled run on the
  # default branch, not a manual run and not a failed or cancelled one.
  # A no-change skip is itself a success whose head SHA was already tested,
  # so it is the same baseline as that execution. An API or parse failure
  # fails this job; it must not be reported as "no changes".
  changes:
    name: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
      - name: Compare the default branch with the last successful scheduled run
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "event=${EVENT_NAME}; non-schedule runs always execute"
            if ! decision=$(EVENT_NAME="$EVENT_NAME" CURRENT_SHA="$CURRENT_SHA" RUN_ID="$RUN_ID" bash tools/perf-schedule-gate.sh /dev/null); then
              echo "schedule gate failed" >&2
              exit 1
            fi
          else
            if [ -z "$DEFAULT_BRANCH" ]; then
              echo "schedule payload has no default branch" >&2
              exit 1
            fi
            gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              -f event=schedule \
              -f status=success \
              -f branch="$DEFAULT_BRANCH" \
              -F per_page=20 \
              "/repos/${REPOSITORY}/actions/workflows/perf.yml/runs" \
              > "$RUNNER_TEMP/perf-schedule-runs.json"
            if ! decision=$(EVENT_NAME="$EVENT_NAME" CURRENT_SHA="$CURRENT_SHA" RUN_ID="$RUN_ID" DEFAULT_BRANCH="$DEFAULT_BRANCH" bash tools/perf-schedule-gate.sh "$RUNNER_TEMP/perf-schedule-runs.json"); then
              echo "schedule gate failed" >&2
              exit 1
            fi
          fi
          printf '%s\n' "$decision"
          case "$decision" in
            should_run=true|should_run=false) ;;
            *)
              echo "unexpected gate decision: ${decision}" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$decision" >> "$GITHUB_OUTPUT"

  perf:
    name: perf (${{ matrix.label }})
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bounded profiles and one-iteration benchmarks. The three long
          # evidence tests run in their own rows so a 40-minute neighbor
          # cannot consume their budget.
          - label: scale
            timeout: 75
            test_timeout: 50m
            packages: ./internal/application ./internal/infrastructure/marketdata ./internal/infrastructure/sqlite
            run: ^(TestHistoricalOverviewDenseFullScale|TestHistoricalSeriesMemoryEvidence|TestHistoricalSeriesBenchmarkCancellationEvidence|TestReviewRepeatedEpochWindowOracleScale|TestUpcomingActionsPerformanceReport|TestHistoricalOverviewDenseRapidSwitchEvidence|TestSourceTrackingProviderRefreshEvidence|TestAnalysisEndToEndPerformanceEvidence|TestSourceTrackingProviderImportBatchEvidence|TestFinancialSourceWriteAmplificationEvidence)$
            bench: ^(BenchmarkHistoricalSeriesBounded|BenchmarkHistoricalOverviewRapidSwitch|BenchmarkUpcomingActionsScale|BenchmarkReviewProjectionIncremental100x20|BenchmarkLegacySnapshotCoverageWarmBoundedTrend|BenchmarkLegacySnapshotCoverageColdBoundedTrend)$
          - label: pipeline
            timeout: 110
            test_timeout: 90m
            packages: ./internal/application
            run: ^TestReviewFullPipelinePerformanceEvidence$
            bench: ""
          - label: paired
            timeout: 70
            test_timeout: 50m
            packages: ./internal/application
            run: ^TestReviewPairedPerformanceEvidence$
            bench: ""
          - label: epoch
            timeout: 65
            test_timeout: 45m
            packages: ./internal/application
            run: ^TestReviewEpochStageDiagnostics$
            bench: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # v6+ hashes go.mod unless this is set. Keep the v5 go.sum key.
          cache-dependency-path: go.sum
      - name: Install native Go build dependencies
        timeout-minutes: 17
        run: bash tools/ci-install-native-deps.sh
      - name: Perf-tagged evidence
        run: |
          set -euo pipefail
          bench=()
          if [ -n "${{ matrix.bench }}" ]; then
            bench=(-bench "${{ matrix.bench }}" -benchtime=1x)
          fi
          go test -tags perf -count=1 -timeout ${{ matrix.test_timeout }} \
            -run "${{ matrix.run }}" \
            "${bench[@]}" \
            ${{ matrix.packages }}

  # Application 2/2 repeatedly exhausted Go's cumulative 10m test budget
  # (PR #60, main, PR #61); no assertion or race detector failure preceded it.
  # Name-hash parts spread one package across runners without increasing
  # in-process concurrency or skipping tests. Eight application parts and four
  # MCP parts are the smallest hash splits whose buckets stay under 10m.
  # sqlite is two parts. -p stays 1 on those shards. Remainder uses -p 2.
  # -parallel stays 4 and only for application and MCP.
  race-shard:
    name: race (${{ matrix.label }})
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: application
            part: 0
            parts: 8
            label: application 1/8
          - shard: application
            part: 1
            parts: 8
            label: application 2/8
          - shard: application
            part: 2
            parts: 8
            label: application 3/8
          - shard: application
            part: 3
            parts: 8
            label: application 4/8
          - shard: application
            part: 4
            parts: 8
            label: application 5/8
          - shard: application
            part: 5
            parts: 8
            label: application 6/8
          - shard: application
            part: 6
            parts: 8
            label: application 7/8
          - shard: application
            part: 7
            parts: 8
            label: application 8/8
          - shard: mcpserver
            part: 0
            parts: 4
            label: mcpserver 1/4
          - shard: mcpserver
            part: 1
            parts: 4
            label: mcpserver 2/4
          - shard: mcpserver
            part: 2
            parts: 4
            label: mcpserver 3/4
          - shard: mcpserver
            part: 3
            parts: 4
            label: mcpserver 4/4
          - shard: sqlite
            part: 0
            parts: 2
            label: sqlite 1/2
          - shard: sqlite
            part: 1
            parts: 2
            label: sqlite 2/2
          - shard: continuousbackup
            part: 0
            parts: 1
            label: continuousbackup
          - shard: remainder
            part: 0
            parts: 1
            label: remainder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # v6+ hashes go.mod unless this is set. Keep the v5 go.sum key.
          cache-dependency-path: go.sum
      - name: Install native Go build dependencies
        timeout-minutes: 17
        run: bash tools/ci-install-native-deps.sh
      - name: Go tests with race detector
        run: |
          set -euo pipefail
          shard="${{ matrix.shard }}"
          part="${{ matrix.part }}"
          parts="${{ matrix.parts }}"
          # One package at a time for the heavy shards. Remainder is many
          # small packages, so -p 2 overlaps their race builds only.
          # -parallel stays 4 and only for application and MCP.
          pkg_parallel=(-p 1)
          parallel=()
          run_args=()
          case "$shard" in
            application)
              pkgs=(./internal/application)
              parallel=(-parallel 4)
              ;;
            mcpserver)
              pkgs=(./internal/mcpserver)
              parallel=(-parallel 4)
              ;;
            sqlite)
              pkgs=(./internal/infrastructure/sqlite)
              ;;
            continuousbackup)
              pkgs=(./internal/infrastructure/continuousbackup)
              ;;
            remainder)
              pkg_parallel=(-p 2)
              # Check enumeration before filtering; process substitution hides
              # a failed go list and can silently drop packages.
              go list ./... > "$RUNNER_TEMP/race-packages.txt"
              mapfile -t pkgs < <(grep -v -E '^github.com/waltwang/nestworth-go/internal/(application$|mcpserver$|infrastructure/sqlite($|/)|infrastructure/continuousbackup($|/))' "$RUNNER_TEMP/race-packages.txt")
              go list ./internal/infrastructure/... > "$RUNNER_TEMP/infrastructure-packages.txt"
              covered=0
              while IFS= read -r pkg || [ -n "$pkg" ]; do
                case "$pkg" in
                  */infrastructure/sqlite|*/infrastructure/sqlite/*|*/infrastructure/continuousbackup|*/infrastructure/continuousbackup/*)
                    covered=$((covered + 1))
                    ;;
                  *)
                    found=0
                    for selected in "${pkgs[@]}"; do
                      if [ "$selected" = "$pkg" ]; then
                        found=1
                        break
                      fi
                    done
                    if [ "$found" -ne 1 ]; then
                      echo "infrastructure package missing from remainder: $pkg" >&2
                      exit 1
                    fi
                    ;;
                esac
              done < "$RUNNER_TEMP/infrastructure-packages.txt"
              if [ "$covered" -lt 2 ]; then
                echo "infrastructure partition does not cover go list" >&2
                exit 1
              fi
              ;;
            *)
              echo "unknown race shard: $shard" >&2
              exit 1
              ;;
          esac
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "race shard selected no packages" >&2
            exit 1
          fi
          if [ "$parts" != "1" ]; then
            if [ "${#pkgs[@]}" -ne 1 ]; then
              echo "split race shard must list exactly one package" >&2
              exit 1
            fi
            # stdout is only the -run regex. A non-zero selector status
            # (list failure, empty runnable set, or empty part) fails the shard.
            # Package mode lists with -race so a race-only test is not dropped.
            if ! regex=$(bash tools/race-shard-select.sh "$part" "$parts" "${pkgs[0]}"); then
              echo "race shard $shard part $part selector failed" >&2
              exit 1
            fi
            if [ -z "$regex" ]; then
              echo "race shard $shard part $part selector returned an empty regex" >&2
              exit 1
            fi
            run_args=(-run "$regex")
          fi
          printf 'shard %s packages:\n' "$shard"
          printf '  %s\n' "${pkgs[@]}"
          go test -race -count=1 -json -timeout 10m "${pkg_parallel[@]}" "${parallel[@]}" "${run_args[@]}" "${pkgs[@]}" | tee "$RUNNER_TEMP/race-results.jsonl"
      - name: Retain race test timings and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: race-${{ matrix.shard }}-${{ matrix.part }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/race-results.jsonl
          if-no-files-found: error
          retention-days: 7

  # always() still evaluates a failed shard. should_run keeps a no-change
  # schedule from turning skipped shards into a failure. A failed changes
  # job leaves should_run unset, so this aggregate is skipped and the
  # changes failure remains the workflow result.
  race:
    needs: [changes, race-shard]
    runs-on: ubuntu-26.04
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.should_run == 'true'
    steps:
      - name: Require every race shard
        run: |
          if [ "${{ needs.race-shard.result }}" != "success" ]; then
            echo "race shards result: ${{ needs.race-shard.result }}"
            exit 1
          fi
          echo "all race shards passed"
