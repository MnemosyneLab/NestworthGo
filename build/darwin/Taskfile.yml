version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Docker image for cross-compilation (used when building on non-macOS)
  CROSS_IMAGE: wails-cross
  # Finder/bundle name used by the current Wails package (Nestworth.app).
  # The Go binary in BIN_DIR stays APP_NAME (nestworth) from the root Taskfile.
  BUNDLE_NAME: '{{.BUNDLE_NAME | default "Nestworth"}}'
  APP_VERSION: '{{.NESTWORTH_VERSION | default "0.3.7"}}'
  APP_BUILD: '{{.NESTWORTH_BUILD | default "8"}}'
  NATIVE_ICNS: '{{.NATIVE_ICNS | default "assets/icons/icon.icns"}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{if eq OS "darwin"}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on macOS
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.OUTPUT}}" ./cmd/nestworth'
    vars:
      # NESTWORTH_VERSION_LDFLAGS stamps internal/version so the packaged
      # application reports the same version/build identity.
      NESTWORTH_VERSION_LDFLAGS: '-X github.com/waltwang/nestworth-go/internal/version.Version={{.NESTWORTH_VERSION | default "v0.3.7"}} -X github.com/waltwang/nestworth-go/internal/version.Build={{.NESTWORTH_BUILD | default "8"}}'
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l" -ldflags="{{.NESTWORTH_VERSION_LDFLAGS}}"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s {{.NESTWORTH_VERSION_LDFLAGS}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  build:docker:
    summary: Cross-compiles for macOS using Docker (for Linux/Windows hosts)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} darwin {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-darwin-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{if eq .ARCH "arm64"}}arm64{{else if eq .ARCH "amd64"}}amd64{{else}}arm64{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - task: '{{if eq OS "darwin"}}build:universal:lipo:native{{else}}build:universal:lipo:go{{end}}'

  build:universal:lipo:native:
    summary: Creates universal binary using native lipo (macOS)
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:universal:lipo:go:
    summary: Creates universal binary using wails3 tool lipo (Linux/Windows)
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/{{.APP_NAME}}" -input "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" -input "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    summary: Packages the application into a `.app` bundle
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH}}'
    cmds:
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle

  package:dmg:
    summary: Packages the application into a styled `.dmg`
    deps:
      - task: package
        vars:
          ARCH: '{{.ARCH}}'
    cmds:
      - task: create:dmg

  package:release:
    summary: Creates arm64 app, versioned DMG and metadata-preserving ZIP, then verifies artifacts
    platforms: [darwin]
    deps:
      - task: package:dmg
        vars:
          ARCH: arm64
    cmds:
      - mkdir -p dist/macos
      - rm -rf "dist/macos/{{.BUNDLE_NAME}}.app"
      - rm -f "dist/macos/{{.BUNDLE_NAME}}-{{.APP_VERSION}}-arm64.dmg" "dist/macos/{{.BUNDLE_NAME}}-{{.APP_VERSION}}-arm64.zip" "dist/macos/SHA256SUMS"
      - /usr/bin/ditto --rsrc --extattr --acl "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app" "dist/macos/{{.BUNDLE_NAME}}.app"
      - |
        set -euo pipefail
        COPIED=false
        for candidate in "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.dmg" "{{.BIN_DIR}}/{{.APP_NAME}}.dmg"; do
          if [ -f "$candidate" ]; then
            cp "$candidate" "dist/macos/{{.BUNDLE_NAME}}-{{.APP_VERSION}}-arm64.dmg"
            COPIED=true
            break
          fi
        done
        test "$COPIED" = "true"
      - /usr/bin/ditto -c -k --sequesterRsrc --keepParent "dist/macos/{{.BUNDLE_NAME}}.app" "dist/macos/{{.BUNDLE_NAME}}-{{.APP_VERSION}}-arm64.zip"
      - |
        set -euo pipefail
        cd dist/macos
        shasum -a 256 "{{.BUNDLE_NAME}}-{{.APP_VERSION}}-arm64.dmg" "{{.BUNDLE_NAME}}-{{.APP_VERSION}}-arm64.zip" > SHA256SUMS
        shasum -a 256 -c SHA256SUMS
      - task: verify:package

  verify:package:
    summary: Checks app identity, version, build, arm64 architecture, signature, DMG, ZIP, and checksums
    platforms: [darwin]
    cmds:
      - |
        set -euo pipefail
        APP="dist/macos/{{.BUNDLE_NAME}}.app"
        DMG="dist/macos/{{.BUNDLE_NAME}}-{{.APP_VERSION}}-arm64.dmg"
        ZIP="dist/macos/{{.BUNDLE_NAME}}-{{.APP_VERSION}}-arm64.zip"
        PLIST="$APP/Contents/Info.plist"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "com.nestworth.app"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST")" = "{{.BUNDLE_NAME}}"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "{{.APP_VERSION}}"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "{{.APP_BUILD}}"
        cmp -s "{{.NATIVE_ICNS}}" "$APP/Contents/Resources/icon.icns"
        test "$(lipo -archs "$APP/Contents/MacOS/{{.BUNDLE_NAME}}")" = "arm64"
        codesign --verify --deep --strict "$APP"
        verify_bundle_payload() {
          candidate="$1"
          test -d "$candidate"
          test ! -L "$candidate"
          for relpath in "Contents/MacOS/{{.BUNDLE_NAME}}" "Contents/Info.plist" "Contents/Resources/icon.icns"; do
            test -f "$candidate/$relpath"
            test ! -L "$candidate/$relpath"
            cmp -s "$APP/$relpath" "$candidate/$relpath"
          done
          cmp -s "{{.NATIVE_ICNS}}" "$candidate/Contents/Resources/icon.icns"
          if [ -f "$APP/Contents/Resources/Assets.car" ]; then
            test -f "$candidate/Contents/Resources/Assets.car"
            test ! -L "$candidate/Contents/Resources/Assets.car"
            cmp -s "$APP/Contents/Resources/Assets.car" "$candidate/Contents/Resources/Assets.car"
          else
            test ! -e "$candidate/Contents/Resources/Assets.car"
          fi
        }
        test -f "$DMG"
        hdiutil imageinfo "$DMG" >/dev/null
        VERIFY_TMP="$(mktemp -d)"
        trap 'hdiutil detach "$VERIFY_TMP/dmg" >/dev/null 2>&1 || true; rm -rf "$VERIFY_TMP"' EXIT
        DMG_MOUNT="$VERIFY_TMP/dmg"
        mkdir -p "$DMG_MOUNT"
        hdiutil attach -readonly -nobrowse -mountpoint "$DMG_MOUNT" "$DMG" >/dev/null
        DMG_APP="$DMG_MOUNT/{{.BUNDLE_NAME}}.app"
        test -d "$DMG_APP"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$DMG_APP/Contents/Info.plist")" = "com.nestworth.app"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$DMG_APP/Contents/Info.plist")" = "{{.APP_VERSION}}"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$DMG_APP/Contents/Info.plist")" = "{{.APP_BUILD}}"
        test "$(lipo -archs "$DMG_APP/Contents/MacOS/{{.BUNDLE_NAME}}")" = "arm64"
        verify_bundle_payload "$DMG_APP"
        codesign --verify --deep --strict "$DMG_APP"
        hdiutil detach "$DMG_MOUNT" >/dev/null
        unzip -tq "$ZIP" >/dev/null
        /usr/bin/ditto -x -k "$ZIP" "$VERIFY_TMP"
        EXTRACTED="$VERIFY_TMP/{{.BUNDLE_NAME}}.app"
        test -d "$EXTRACTED"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXTRACTED/Contents/Info.plist")" = "com.nestworth.app"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$EXTRACTED/Contents/Info.plist")" = "{{.APP_VERSION}}"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXTRACTED/Contents/Info.plist")" = "{{.APP_BUILD}}"
        test "$(lipo -archs "$EXTRACTED/Contents/MacOS/{{.BUNDLE_NAME}}")" = "arm64"
        verify_bundle_payload "$EXTRACTED"
        codesign --verify --deep --strict "$EXTRACTED"
        (cd dist/macos && shasum -a 256 -c SHA256SUMS)
        echo "Verified $APP, versioned DMG and metadata-preserving ZIP (ad-hoc signed for local launch; Developer ID/notarization remain open)."

  create:dmg:
    summary: Creates a UDZO DMG with an Applications shortcut
    platforms: [darwin]
    cmds:
      - |
        set -euo pipefail
        STAGING="{{.BIN_DIR}}/dmg-root"
        rm -rf "$STAGING"
        mkdir -p "$STAGING"
        /usr/bin/ditto --rsrc --extattr --acl "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app" "$STAGING/{{.BUNDLE_NAME}}.app"
        ln -s /Applications "$STAGING/Applications"
        cp "{{.NATIVE_ICNS}}" "$STAGING/.VolumeIcon.icns"
        if command -v SetFile >/dev/null 2>&1; then
          SetFile -a C "$STAGING" || true
        fi
        hdiutil create -volname "{{.BUNDLE_NAME}}" -srcfolder "$STAGING" -ov -format UDZO "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.dmg"
        rm -rf "$STAGING"

  create:app:bundle:
    summary: Creates a clean `.app` bundle in the repository build directory
    cmds:
      - |
        set -eu
        REPO_ROOT="$(pwd -P)"
        case "{{.BIN_DIR}}" in
          /*) BIN_REQUEST="{{.BIN_DIR}}" ;;
          *) BIN_REQUEST="$REPO_ROOT/{{.BIN_DIR}}" ;;
        esac
        while [ "$BIN_REQUEST" != "/" ] && [ "${BIN_REQUEST%/}" != "$BIN_REQUEST" ]; do
          BIN_REQUEST="${BIN_REQUEST%/}"
        done
        case "$BIN_REQUEST/" in
          "$REPO_ROOT/"*) ;;
          *)
            echo "Refusing build directory outside the repository: $BIN_REQUEST" >&2
            exit 1
            ;;
        esac
        if [ -L "$BIN_REQUEST" ]; then
          echo "Refusing symlinked build directory: $BIN_REQUEST" >&2
          exit 1
        fi
        if [ ! -d "$BIN_REQUEST" ]; then
          BIN_PARENT="$(dirname "$BIN_REQUEST")"
          if [ ! -d "$BIN_PARENT" ]; then
            echo "Build directory parent must already exist: $BIN_PARENT" >&2
            exit 1
          fi
          PARENT_PHYS="$(cd "$BIN_PARENT" && pwd -P)"
          case "$PARENT_PHYS/" in
            "$REPO_ROOT/"*) ;;
            *)
              echo "Refusing build directory through an external parent: $PARENT_PHYS" >&2
              exit 1
              ;;
          esac
          mkdir "$BIN_REQUEST"
        fi
        BIN_PHYS="$(cd "$BIN_REQUEST" && pwd -P)"
        if [ "$BIN_PHYS" = "$REPO_ROOT" ]; then
          echo "Refusing to use the repository root as the build output directory" >&2
          exit 1
        fi
        case "$BIN_PHYS/" in
          "$REPO_ROOT/"*) ;;
          *)
            echo "Refusing build directory outside the repository: $BIN_PHYS" >&2
            exit 1
            ;;
        esac
        case "{{.BUNDLE_NAME}}" in
          ""|"."|".."|*/*)
            echo "Invalid application bundle name" >&2
            exit 1
            ;;
        esac

        TARGET="$BIN_PHYS/{{.BUNDLE_NAME}}.app"
        APP_EXEC="$BIN_PHYS/{{.APP_NAME}}"
        if [ -L "$TARGET" ] || { [ -e "$TARGET" ] && [ ! -d "$TARGET" ]; }; then
          echo "Refusing symlink or non-directory app target: $TARGET" >&2
          exit 1
        fi
        if [ -L "$APP_EXEC" ] || [ ! -f "$APP_EXEC" ]; then
          echo "Expected a regular build executable at $APP_EXEC" >&2
          exit 1
        fi

        STAGE_ROOT="$(mktemp -d "$BIN_PHYS/.{{.BUNDLE_NAME}}.app-stage.XXXXXX")"
        STAGED="$STAGE_ROOT/{{.BUNDLE_NAME}}.app"
        PREVIOUS="$STAGE_ROOT/previous.app"
        HAD_OLD=0
        SWAPPED=0
        KEEP_STAGE=0
        cleanup() {
          if [ "$SWAPPED" -eq 0 ] && [ "$HAD_OLD" -eq 1 ]; then
            if [ ! -e "$TARGET" ] && [ ! -L "$TARGET" ] && [ -d "$PREVIOUS" ] && [ ! -L "$PREVIOUS" ]; then
              mv "$PREVIOUS" "$TARGET" || KEEP_STAGE=1
            else
              echo "Previous app bundle preserved at $PREVIOUS because it could not be safely restored" >&2
              KEEP_STAGE=1
            fi
          fi
          if [ "$KEEP_STAGE" -eq 0 ]; then
            rm -rf "$STAGE_ROOT"
          fi
        }
        trap cleanup EXIT

        mkdir -p "$STAGED/Contents/MacOS" "$STAGED/Contents/Resources"
        cp "{{.NATIVE_ICNS}}" "$STAGED/Contents/Resources/icon.icns"
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "$STAGED/Contents/Resources/Assets.car"
        fi
        cp "$APP_EXEC" "$STAGED/Contents/MacOS/{{.BUNDLE_NAME}}"
        cp build/darwin/Info.plist "$STAGED/Contents/Info.plist"
        if [ "{{OS}}" = "darwin" ]; then
          codesign --force --deep --sign - "$STAGED"
        else
          echo "Skipping codesign (not available on {{OS}}). Sign the .app on macOS before distribution."
        fi

        if [ -L "$TARGET" ] || { [ -e "$TARGET" ] && [ ! -d "$TARGET" ]; }; then
          echo "Refusing symlink or non-directory app target: $TARGET" >&2
          exit 1
        fi
        if [ -e "$TARGET" ]; then
          mv "$TARGET" "$PREVIOUS"
          HAD_OLD=1
        fi
        if [ -e "$TARGET" ] || [ -L "$TARGET" ]; then
          echo "App target appeared during replacement; refusing to overwrite: $TARGET" >&2
          exit 1
        fi
        if ! mv "$STAGED" "$TARGET"; then
          echo "Could not move staged app bundle into place: $TARGET" >&2
          exit 1
        fi
        SWAPPED=1
        if [ "$HAD_OLD" -eq 1 ]; then
          rm -rf "$PREVIOUS"
          HAD_OLD=0
        fi

  codesign:adhoc:
    summary: Ad-hoc signs the app bundle (macOS only)
    internal: true
    cmds:
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app"

  codesign:skip:
    summary: Skips codesigning when cross-compiling
    internal: true
    cmds:
      - 'echo "Skipping codesign (not available on {{OS}}). Sign the .app on macOS before distribution."'

  run:
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.dev.app/Contents/Resources"
      - cp "{{.NATIVE_ICNS}}" "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.dev.app/Contents/Resources/icon.icns"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.dev.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.dev.app/Contents/MacOS/{{.BUNDLE_NAME}}"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.dev.app/Contents/Info.plist"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.BUNDLE_NAME}}.dev.app/Contents/MacOS/{{.BUNDLE_NAME}}"'

  sign:
    summary: Signs the application bundle with Developer ID
    desc: |
      Signs the .app bundle for distribution.
      Uses signing identity from `wails3 setup` (stored in ~/.config/wails/defaults.yaml).
      Override with: task darwin:sign -- --identity "Developer ID Application: ..."
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app" {{.CLI_ARGS}}

  sign:notarize:
    summary: Signs and notarizes the application bundle
    desc: |
      Signs the .app bundle and submits it for notarization.
      Uses signing identity and keychain profile from `wails3 setup`.

      First-time setup:
        wails3 setup
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app" --notarize {{.CLI_ARGS}}
