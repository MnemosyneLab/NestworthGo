version: '3'

vars:
  APP_NAME: "nestworth"
  BIN_DIR: "bin"
  # pnpm is the maintained frontend package manager; see the Engineering Guide.
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  setup:
    summary: Sets up Go and frontend dependencies and generates Wails bindings
    desc: |
      Run this once after cloning or switching to a clean checkout. Generated
      TypeScript bindings remain ignored and are recreated when needed.
    cmds:
      - go mod download
      - task: common:install:frontend:deps
      - task: common:generate:bindings

  generate:bindings:
    summary: Regenerates the ignored Wails TypeScript bindings
    cmds:
      - task: common:generate:bindings

  check:
    summary: Runs the Go and frontend validation suite
    desc: |
      The frontend build dependency also regenerates bindings and produces the
      embedded frontend bundle before Go compilation.
    deps:
      - task: common:build:frontend
    cmds:
      - test -z "$(gofmt -l cmd internal)"
      - go test ./...
      - go vet ./...
      - go build ./cmd/nestworth
      - task: common:frontend:run
        vars:
          SCRIPT: lint
      - task: common:frontend:run
        vars:
          SCRIPT: typecheck
      - task: common:frontend:run
        vars:
          SCRIPT: test

  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  package:dmg:
    summary: Packages the macOS application as a DMG
    platforms: [darwin]
    cmds:
      - task: darwin:package:dmg

  package:release:
    summary: Builds and verifies the local macOS app and arm64 DMG artifacts
    platforms: [darwin]
    cmds:
      - task: darwin:package:release

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in Wails development mode
    desc: |
      Starts the Wails shell, Vite dev server, and Go rebuild loop using
      build/config.yml. Override the port with WAILS_VITE_PORT=...
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
